  <rect x="250" y="96" width="925" height="150" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="250" y="96" width="6" height="150" fill="#E10600" rx="3"/>
  
  <text x="276" y="128" fill="#E10600" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">NEXT GRAND PRIX</text>
  <text x="276" y="165" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="28">GRAND PRIX DE MONACO</text>
  <text x="276" y="195" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Circuit de Monaco • 78 Laps • High Downforce • 75% Safety Car Probability</text>
  <text x="276" y="222" fill="#FACC15" font-family="monospace" font-size="12">AI OBJECTIVE: QUALIFY BOTH CARS IN TOP 4 • TARGET POINTS: 28+</text>

