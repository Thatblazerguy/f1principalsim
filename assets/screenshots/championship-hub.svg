  <rect x="250" y="266" width="290" height="380" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="270" y="296" fill="#E10600" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">DRIVER ROSTER</text>

  <!-- Driver 1 Card -->
  <rect x="266" y="312" width="258" height="145" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="276" y="324" width="4" height="24" rx="2" fill="#E8002D"/>
  <text x="288" y="342" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="15">Charles Leclerc</text>
  <text x="475" y="342" fill="#FACC15" font-family="monospace" font-weight="bold" font-size="16">93 OVR</text>
  
