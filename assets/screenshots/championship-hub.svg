  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
    <!-- P1 Ferrari -->
    <rect x="896" y="312" width="263" height="36" rx="6" fill="rgba(225,6,0,0.15)" stroke="#E10600" stroke-width="1"/>
    <text x="910" y="335" fill="#FFF" font-weight="bold">1. Ferrari HP</text>
    <text x="1115" y="335" fill="#4ADE80" font-family="monospace" font-weight="bold">204 pts</text>

    <!-- P2 Red Bull -->
    <rect x="896" y="356" width="263" height="34" rx="6" fill="rgba(0,0,0,0.2)"/>
    <text x="910" y="378" fill="#CBD5E1">2. Red Bull Racing</text>
    <text x="1115" y="378" fill="#FFF" font-family="monospace">188 pts</text>

    <!-- P3 McLaren -->
    <rect x="896" y="398" width="263" height="34" rx="6" fill="rgba(0,0,0,0.2)"/>
    <text x="910" y="420" fill="#CBD5E1">3. McLaren F1 Team</text>
    <text x="1115" y="420" fill="#FFF" font-family="monospace">172 pts</text>

    <!-- P4 Mercedes -->
    <rect x="896" y="440" width="263" height="34" rx="6" fill="rgba(0,0,0,0.2)"/>
    <text x="910" y="462" fill="#CBD5E1">4. Mercedes-AMG</text>
    <text x="1115" y="462" fill="#FFF" font-family="monospace">114 pts</text>

    <!-- P5 Aston Martin -->
    <rect x="896" y="482" width="263" height="34" rx="6" fill="rgba(0,0,0,0.2)"/>
    <text x="910" y="504" fill="#CBD5E1">5. Aston Martin</text>
    <text x="1115" y="504" fill="#FFF" font-family="monospace">46 pts</text>
  </g>

  <!-- Budget Cap Snapshot -->
  <rect x="896" y="530" width="263" height="95" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="910" y="555" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" font-size="10" letter-spacing="1">FIA FINANCIAL CAP USAGE</text>
  <text x="910" y="580" fill="#FFF" font-family="monospace" font-size="16" font-weight="bold">$92.4M / $145.0M CAP</text>
  <rect x="910" y="595" width="235" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="910" y="595" width="150" height="6" rx="3" fill="#22C55E"/>
</svg>

