    <text x="32" y="104" fill="#FFFFFF">🏎️ Championship Hub</text>

    <text x="32" y="146" fill="#94A3B8">🏁 Race Weekend</text>
    <text x="32" y="186" fill="#94A3B8">🔧 Engineering R&amp;D</text>
    <text x="32" y="226" fill="#94A3B8">🎓 Driver Academy</text>
    <text x="32" y="266" fill="#94A3B8">👥 Roster &amp; Market</text>
    <text x="32" y="306" fill="#94A3B8">💰 Finance &amp; Sponsors</text>
    <text x="32" y="346" fill="#94A3B8">🏛️ FIA Governance</text>
    <text x="32" y="386" fill="#94A3B8">📊 History &amp; Replay</text>
    <text x="32" y="426" fill="#94A3B8">🏆 Leaderboard</text>
  </g>

  <!-- Team Profile Footer in Sidebar -->
  <rect x="12" y="590" width="196" height="65" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="36" cy="622" r="14" fill="#E8002D"/>
  <text x="30" y="626" fill="#FFF" font-family="monospace" font-weight="bold" font-size="12">SF</text>
  <text x="58" y="618" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12">Ferrari HP</text>
  <text x="58" y="634" fill="#4ADE80" font-family="monospace" font-size="11">$84.2M Budget</text>

