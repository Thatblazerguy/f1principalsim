  <text x="250" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">2026 FIA Formula One World Championship • Round 7 of 24</text>
  
  <rect x="1010" y="32" width="165" height="38" rx="8" fill="url(#ferrariRed)"/>
  <text x="1032" y="56" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">START WEEKEND →</text>

