  <rect x="1020" y="116" width="135" height="110" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <path d="M 1040 190 C 1030 150 1060 130 1090 140 C 1120 150 1140 180 1120 200 C 1090 215 1060 210 1040 190 Z" fill="none" stroke="#E10600" stroke-width="3"/>
  <text x="1045" y="215" fill="#94A3B8" font-family="monospace" font-size="10">3.337 km</text>

