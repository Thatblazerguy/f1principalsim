    <rect x="585" y="345" width="228" height="8" rx="4" fill="#38BDF8"/>

    <text x="585" y="385" fill="#FFF" font-weight="bold">Power Unit (Engine)</text>
    <text x="815" y="385" fill="#E10600" font-family="monospace">94 / 100</text>
    <rect x="585" y="395" width="250" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="585" y="395" width="235" height="8" rx="4" fill="#E10600"/>

    <text x="585" y="435" fill="#FFF" font-weight="bold">Chassis &amp; Suspension</text>
    <text x="815" y="435" fill="#FACC15" font-family="monospace">88 / 100</text>
    <rect x="585" y="445" width="250" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="585" y="445" width="220" height="8" rx="4" fill="#FACC15"/>

    <text x="585" y="485" fill="#FFF" font-weight="bold">Reliability</text>
