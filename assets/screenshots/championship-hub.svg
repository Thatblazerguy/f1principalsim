<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ferrariRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E10600"/>
      <stop offset="100%" stop-color="#C00000"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#hubBg)"/>

  <!-- Left Sidebar Navigation (Width 220) -->
  <rect x="0" y="0" width="220" height="675" fill="#080B12" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="24" y="24" width="36" height="24" rx="4" fill="url(#ferrariRed)"/>
  <text x="32" y="41" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="14">F1</text>
  <text x="68" y="41" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" letter-spacing="1">MANAGER</text>
  
  <!-- Sidebar Links -->
