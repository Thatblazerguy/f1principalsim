  <rect x="266" y="470" width="258" height="145" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="276" y="482" width="4" height="24" rx="2" fill="#E8002D"/>
  <text x="288" y="500" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="15">Lewis Hamilton</text>
  <text x="475" y="500" fill="#FACC15" font-family="monospace" font-weight="bold" font-size="16">92 OVR</text>
  
  <g font-family="monospace" font-size="11" fill="#94A3B8">
