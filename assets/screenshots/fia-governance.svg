<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="fiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#141D30"/>
    </linearGradient>
    <linearGradient id="fiaBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#fiaBg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#080B12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="32" y="16" width="48" height="28" rx="4" fill="url(#fiaBlue)"/>
  <text x="44" y="36" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="16">FIA</text>
  <text x="92" y="38" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="18" letter-spacing="1">GOVERNANCE &amp; CIRCUIT DESIGNER</text>
  <text x="560" y="38" fill="#94A3B8" font-family="monospace" font-size="13">FÉDÉRATION INTERNATIONALE DE L'AUTOMOBILE • 2026 WORLD MOTOR SPORT COUNCIL</text>

  <!-- Left: Regulations & Governance Controls (Width 360) -->
  <rect x="32" y="80" width="360" height="565" rx="12" fill="url(#cardGrad4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="52" y="110" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">SPORTING &amp; TECHNICAL REGULATIONS</text>

  <!-- Reg 1: Cost Cap -->
  <rect x="52" y="128" width="320" height="74" rx="8" fill="rgba(0,0,0,0.3)"/>
  <text x="68" y="152" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Cost Cap Limit</text>
  <text x="310" y="152" fill="#4ADE80" font-family="monospace" font-weight="bold" font-size="13">$145.0M</text>
  <text x="68" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Range: $80M - $250M • Adjusted for inflation</text>
  <rect x="68" y="186" width="288" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="68" y="186" width="180" height="4" rx="2" fill="#3B82F6"/>

  <!-- Reg 2: Min Weight -->
  <rect x="52" y="212" width="320" height="74" rx="8" fill="rgba(0,0,0,0.3)"/>
  <text x="68" y="236" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Minimum Car Weight</text>
  <text x="325" y="236" fill="#38BDF8" font-family="monospace" font-weight="bold" font-size="13">800 kg</text>
  <text x="68" y="256" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Dry weight without driver ballast</text>
  <rect x="68" y="270" width="288" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="68" y="270" width="160" height="4" rx="2" fill="#38BDF8"/>

  <!-- Reg 3: Sprint Weekends -->
  <rect x="52" y="296" width="320" height="74" rx="8" fill="rgba(0,0,0,0.3)"/>
  <text x="68" y="320" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Sprint Weekends / Year</text>
  <text x="325" y="320" fill="#FACC15" font-family="monospace" font-weight="bold" font-size="13">6 Races</text>
  <text x="68" y="340" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Sprint Shootout format + Top 8 points</text>
  <rect x="68" y="354" width="288" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="68" y="354" width="144" height="4" rx="2" fill="#FACC15"/>

  <!-- Reg 4: Calendar Size & Grid Size -->
  <rect x="52" y="380" width="320" height="74" rx="8" fill="rgba(0,0,0,0.3)"/>
  <text x="68" y="404" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Calendar Capacity</text>
  <text x="315" y="404" fill="#FFF" font-family="monospace" font-weight="bold" font-size="13">24 Rounds</text>
  <text x="68" y="424" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Max Concorde Agreement limit: 25</text>
  <rect x="68" y="438" width="288" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="68" y="438" width="260" height="4" rx="2" fill="#10B981"/>

  <!-- Stewards Decisions Box -->
  <rect x="52" y="468" width="320" height="155" rx="8" fill="rgba(225,6,0,0.06)" stroke="rgba(225,6,0,0.3)" stroke-width="1"/>
  <text x="68" y="492" fill="#E10600" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" letter-spacing="1">STEWARDS DECISIONS &amp; LICENSING</text>
  <text x="68" y="515" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12">Document 44: Turn 1 Collision</text>
  <text x="68" y="534" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Driver #11 penalized +5 sec for forcing car off track.</text>
  <text x="68" y="565" fill="#FACC15" font-family="monospace" font-size="11">Penalty Points: 2 points added (Total: 4/12)</text>
  <text x="68" y="598" fill="#4ADE80" font-family="monospace" font-size="11">✓ Super License status: VALID</text>

  <!-- Right: FIA Circuit Designer & Circuit Library (Width 775) -->
  <rect x="412" y="80" width="756" height="565" rx="12" fill="url(#cardGrad4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="432" y="110" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">FIA CIRCUIT DESIGNER &amp; CIRCUIT LIBRARY (24+ VENUES)</text>

  <!-- Circuit Designer Canvas Mini (Top Right) -->
  <rect x="432" y="128" width="716" height="280" rx="10" fill="#0A0E17" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="152" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14">CIRCUIT EDITOR: KYALAMI INTERNATIONAL GRAND PRIX CIRCUIT</text>
  <text x="450" y="170" fill="#94A3B8" font-family="monospace" font-size="11">Grade 1 Certification Inspection • 4.529 km • 16 Turns • Altitude 1,520m</text>

  <!-- Custom Circuit Path -->
  <path d="M 500 320 C 470 240 520 200 580 210 C 640 220 700 180 770 190 C 850 200 900 240 920 290 C 930 330 870 360 810 340 C 750 320 680 370 600 370 C 530 370 510 350 500 320 Z" 
        fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M 500 320 C 470 240 520 200 580 210 C 640 220 700 180 770 190 C 850 200 900 240 920 290 C 930 330 870 360 810 340 C 750 320 680 370 600 370 C 530 370 510 350 500 320 Z" 
        fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>

  <!-- DRS Detection & Activation Pins -->
  <circle cx="770" cy="190" r="6" fill="#22C55E"/>
  <text x="750" y="175" fill="#22C55E" font-family="monospace" font-size="10" font-weight="bold">DRS ZONE 1</text>

  <circle cx="600" cy="370" r="6" fill="#22C55E"/>
  <text x="580" y="395" fill="#22C55E" font-family="monospace" font-size="10" font-weight="bold">DRS ZONE 2</text>

  <circle cx="500" cy="320" r="7" fill="#E10600"/>
  <text x="450" y="325" fill="#FFF" font-family="monospace" font-size="10" font-weight="bold">START / FINISH</text>

  <!-- Suitability Pillars Analysis Box (Bottom Right) -->
  <text x="432" y="438" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" letter-spacing="1">CIRCUIT DEMANDS &amp; CAR SUITABILITY PILLARS</text>
  
  <g font-family="monospace" font-size="11">
    <rect x="432" y="450" width="225" height="42" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="444" y="474" fill="#94A3B8">Engine Power: <tspan fill="#FFF" font-weight="bold">9/10 (High)</tspan></text>

    <rect x="677" y="450" width="225" height="42" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="689" y="474" fill="#94A3B8">Downforce: <tspan fill="#FFF" font-weight="bold">7/10 (Medium)</tspan></text>

    <rect x="922" y="450" width="225" height="42" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="934" y="474" fill="#94A3B8">Mechanical Grip: <tspan fill="#FFF" font-weight="bold">8/10 (High)</tspan></text>

    <rect x="432" y="502" width="225" height="42" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="444" y="526" fill="#94A3B8">Tyre Degradation: <tspan fill="#FACC15" font-weight="bold">8/10 (Severe)</tspan></text>

    <rect x="677" y="502" width="225" height="42" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="689" y="526" fill="#94A3B8">Braking Load: <tspan fill="#FFF" font-weight="bold">6/10 (Moderate)</tspan></text>

    <rect x="922" y="502" width="225" height="42" rx="6" fill="rgba(0,0,0,0.3)"/>
    <text x="934" y="526" fill="#94A3B8">Cooling Severity: <tspan fill="#EF4444" font-weight="bold">9/10 (Critical)</tspan></text>
  </g>

  <!-- Sanctioning Button -->
  <rect x="432" y="565" width="716" height="50" rx="8" fill="url(#fiaBlue)"/>
  <text x="670" y="596" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" letter-spacing="1">SANCTION KYALAMI GP FOR 2027 CALENDAR (+24 CHAMPIONSHIP ROUNDS)</text>
</svg>

